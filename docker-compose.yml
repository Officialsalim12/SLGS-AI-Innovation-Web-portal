services:
  postgres:
    image: postgres:16-alpine
    container_name: ghs-hackathon-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ghs
      POSTGRES_PASSWORD: ghs_dev_password
      POSTGRES_DB: ghs_hackathon
    volumes:
      - ghs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghs -d ghs_hackathon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ghs_pg_data:
